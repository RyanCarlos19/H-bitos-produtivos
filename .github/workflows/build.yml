name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ProductiveHabits.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle -p ProductiveHabits assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Productive-Habits-APK
          path: ProductiveHabits/app/build/outputs/apk/debug/app-debug.apk
